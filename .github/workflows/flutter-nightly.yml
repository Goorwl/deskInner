name: LAN Desktop Packages (macOS arm64 + Windows x64)

on:
  # [LAN-ONLY] Daily full-matrix nightly is disabled. This fork only ships the
  # two LAN desktop installers; running ~20 upstream jobs every night needs a
  # signing/relay service the fork does not have and fails on Android/iOS/Linux.
  # schedule:
  #   - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  run-flutter-nightly-build:
    # [LAN-ONLY] flutter-build.yml contains jobs (generate-sbom,
    # publish-signed-update-metadata) requesting contents: write. A reusable
    # workflow may not exceed its caller's permission ceiling, and this fork
    # defaults to contents: read, so the whole workflow fails to parse without
    # an explicit grant here. The publish-signed-update-metadata job itself is
    # still skipped in forks (its if requires github.repository == rustdesk/rustdesk).
    permissions:
      contents: write
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "lan-desktop"
      # [LAN-ONLY] Skip Android / iOS / Linux / Sciter and the extra CPU arches;
      # only the Apple Silicon dmg and the Windows x64 installer are built.
      desktop-only: true
      publish-update-metadata: ${{ github.repository == 'rustdesk/rustdesk' }}
